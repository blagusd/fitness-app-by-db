<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="keywords" content="Fitness, Health, Workout, Exercise, Gym" />
    <meta
      name="description"
      content="This application is designed to collect, process, and analyze fitness activity data."
    />
    <link rel="stylesheet" href="css/main.css" />
    <script type="module" src="js/controller.js"></script>
    <title>Fitness App By DB!</title>
  </head>
  <body>
    <header>
      <h1><i>Welcome to</i> Fitness App By DB!</h1>
      <div class="header-buttons">
        <button class="update__btn">Update results</button>
        <button class="load__btn">Load new .fit file</button>
      </div>
    </header>
    <div class="overlay-container"></div>
    <aside>
      <!-- Workout selection menu -->
      <h2>Choose workout to display the results</h2>
      <ul class="workouts">
        <li>
          <button class="workout__btn" disabled>
            Please update the results 🔁
          </button>
        </li>
        <!-- 
            <li><button class="workout-btn" data-type="running">Running</button></li>
            <li><button class="workout-btn" data-type="strength">Strength Workout</button></li>
            <li><button class="workout-btn" data-type="cycling">Cycling</button></li>
            <li><button class="workout-btn" data-type="yoga">Yoga</button></li>
          -->
      </ul>
    </aside>
    <main>
      <section class="workout-stats">
        <!-- Workout stats panel -->
        <h3>Workout Statistics</h3>
        <ul>
          <!--<li>Type: <span class="workout-type">-</span></li>
          <li>Date: <span class="workout-date">-</span></li>
          <li>Duration: <span class="workout-duration">-</span></li>
            <li>Distance: <span class="workout-distance">-</span></li>
            <li>Average Speed: <span class="workout-speed">-</span></li>
            <li>Calories Burned: <span class="workout-calories">-</span></li>
            <li>Heart Rate: <span class="workout-heart-rate">-</span></li>
            <li>Elevation Gain: <span class="workout-elevation">-</span></li>
            -->
        </ul>
      </section>
      <section class="workout-recents">
        <!-- Recent workouts list -->
        <h3>Recent workouts</h3>
        <label id="workout-count-label" for="workout-count">Show last </label>
        <input
          type="number"
          id="workout-count"
          name="workout-count"
          min="1"
          max="20"
          value="5"
        />
        <span class="workout-recents-list">
          <ul>
            <!--
            <li>Running - 30 mins - Oct 1, 2025</li>
            <li>Cycling - 45 mins - Oct 3, 2025</li>
            <li>Strength Workout - 60 mins - Oct 5, 2025</li>
            -->
          </ul>
        </span>
      </section>
    </main>
    <section class="workout-map">
      <!-- Map display -->
      <h3>Workout Route</h3>
      <div class="map-container">
        <!-- Placeholder for map integration -->
      </div>
    </section>
    <footer id="copyrights">
      <p>Copyrights © 2025</p>
      <p><i>Fitness App By DB</i></p>
    </footer>
  </body>
</html>
